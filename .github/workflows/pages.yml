name: 위키 사이트 배포

# docs/ 나 변환 도구가 바뀌면 사이트를 다시 만들어 GitHub Pages 로 올린다.
# 마크다운만 고치고 푸시하면 사이트가 따라온다.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 두 번 배포되지 않게. 진행 중인 것은 끝내고 최신 것만 올린다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 각 문서의 최종 편집일을 git log 에서 읽는다

      - name: 생성
        run: python3 tools/build_wiki.py --out site

      - name: 검사
        run: python3 tools/check_site.py --out site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
