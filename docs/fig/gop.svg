<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="880" height="196" viewBox="0 0 880 196">
  <style>
    /* 페이지에 심기면 페이지의 --dg-* 토큰을 따르고,
       GitHub 에서 단독으로 열면 뒤의 대체값이 적용된다. */
    .dg text { font-family: -apple-system, "Segoe UI", Arial, "Malgun Gothic", sans-serif;
               fill: var(--dg-text, #202122); }
    .dg .bx  { fill: var(--dg-fill, #eaecf0);  stroke: var(--dg-line, #54595d); stroke-width: 1; }
    .dg .bx2 { fill: var(--dg-fill2, #ffffff); stroke: var(--dg-line, #54595d); stroke-width: 1; }
    .dg .ln  { stroke: var(--dg-line, #54595d); stroke-width: 1.2; fill: none; }
    .dg .acc { stroke: var(--dg-accent, #3366cc); fill: none; stroke-width: 1.6; }
    .dg .accf { fill: var(--dg-accent, #3366cc); }
    .dg .warnf { fill: var(--dg-warn, #d73333); }
    .dg .okf { fill: var(--dg-ok, #14866d); }
    .dg .lbl { font-size: 11px; }
    .dg .lbl-b { font-size: 11px; font-weight: 700; }
    .dg .lbl-sm { font-size: 9.5px; opacity: .78; }
    .dg .mono { font-family: ui-monospace, Consolas, "DejaVu Sans Mono", monospace; font-size: 10px; }
  </style>
  <defs>
    <marker id="g_ah" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="var(--dg-accent, #3366cc)"/>
    </marker>
  </defs>
  <text class="lbl-b" x="8" y="16">GOP = 30 (1초, 30 fps) · 프레임 크기를 막대 높이로</text>
  <path class="ln" d="M40 120 h820" opacity=".6"/>

  <rect x="46" y="44" width="22" height="76" class="accf"/>
  <text class="lbl-b" x="57" y="134" text-anchor="middle">I</text>
  <text class="mono" x="57" y="38" text-anchor="middle">60 KB</text>

  <g class="bx">
    <rect x="76" y="104" width="22" height="16"/><rect x="106" y="100" width="22" height="20"/>
    <rect x="136" y="106" width="22" height="14"/><rect x="166" y="98" width="22" height="22"/>
    <rect x="196" y="106" width="22" height="14"/><rect x="226" y="102" width="22" height="18"/>
    <rect x="256" y="108" width="22" height="12"/><rect x="286" y="100" width="22" height="20"/>
    <rect x="316" y="105" width="22" height="15"/><rect x="346" y="103" width="22" height="17"/>
    <rect x="376" y="107" width="22" height="13"/><rect x="406" y="99" width="22" height="21"/>
    <rect x="436" y="106" width="22" height="14"/><rect x="466" y="102" width="22" height="18"/>
    <rect x="496" y="108" width="22" height="12"/>
  </g>
  <g class="lbl" text-anchor="middle">
    <text x="87" y="134">P</text><text x="117" y="134">P</text><text x="147" y="134">P</text>
    <text x="177" y="134">P</text><text x="207" y="134">P</text><text x="237" y="134">P</text>
    <text x="267" y="134">P</text><text x="297" y="134">P</text><text x="327" y="134">P</text>
    <text x="357" y="134">P</text><text x="387" y="134">P</text><text x="417" y="134">P</text>
    <text x="447" y="134">P</text><text x="477" y="134">P</text><text x="507" y="134">P</text>
  </g>
  <text class="mono" x="292" y="92" text-anchor="middle" opacity=".8">2~6 KB</text>
  <text class="lbl-sm" x="540" y="114">…</text>

  <rect x="566" y="44" width="22" height="76" class="accf"/>
  <text class="lbl-b" x="577" y="134" text-anchor="middle">I</text>
  <text class="mono" x="577" y="38" text-anchor="middle">60 KB</text>
  <g class="bx">
    <rect x="596" y="104" width="22" height="16"/><rect x="626" y="101" width="22" height="19"/>
    <rect x="656" y="107" width="22" height="13"/>
  </g>
  <g class="lbl" text-anchor="middle">
    <text x="607" y="134">P</text><text x="637" y="134">P</text><text x="667" y="134">P</text>
  </g>

  <g class="acc" opacity=".8">
    <path d="M87 152 C 80 166, 64 166, 57 154" marker-end="url(#g_ah)"/>
    <path d="M117 152 C 110 166, 94 166, 87 154" marker-end="url(#g_ah)"/>
    <path d="M147 152 C 140 166, 124 166, 117 154" marker-end="url(#g_ah)"/>
    <path d="M177 152 C 170 166, 154 166, 147 154" marker-end="url(#g_ah)"/>
  </g>
  <text class="lbl-sm" x="200" y="172" fill="var(--dg-accent, #3366cc)">P 는 앞 프레임을 참조한다 — 혼자서는 디코딩되지 않는다</text>

  <path class="ln" d="M46 26 h520" stroke-dasharray="4 3" opacity=".7"/>
  <path class="ln" d="M46 22 v8 M566 22 v8" opacity=".7"/>
  <text class="lbl-sm" x="306" y="20" text-anchor="middle">GOP 1개 = 30 프레임 = 1초</text>

  <path d="M300 120 v-10" class="ln" stroke="var(--dg-warn, #d73333)" stroke-width="1.6"/>
  <circle cx="300" cy="108" r="3" class="warnf"/>
  <path class="ln" stroke="var(--dg-warn, #d73333)" stroke-width="1.4" stroke-dasharray="3 2" d="M300 104 H 566"/>
  <text class="lbl-b" x="700" y="108" fill="var(--dg-warn, #d73333)">새 시청자 접속</text>
  <text class="lbl-sm" x="700" y="121" fill="var(--dg-warn, #d73333)">다음 I 까지 아무것도 못 본다</text>

  <text class="lbl-sm" x="40" y="190">GOP 가 길면 압축 효율이 오르고 첫 화면 지연이 커진다. 짧으면 반대다. 감시 카메라는 보통 1~2초를 쓴다.</text>
</svg>
