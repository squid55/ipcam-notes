<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="910" height="352" viewBox="0 0 910 352">
  <style>
    /* 페이지에 심기면 페이지의 --dg-* 토큰을 따르고,
       GitHub 에서 단독으로 열면 뒤의 대체값이 적용된다. */
    .dg text { font-family: -apple-system, "Segoe UI", Arial, "Malgun Gothic", sans-serif;
               fill: var(--dg-text, #202122); }
    .dg .bx  { fill: var(--dg-fill, #eaecf0);  stroke: var(--dg-line, #54595d); stroke-width: 1; }
    .dg .bx2 { fill: var(--dg-fill2, #ffffff); stroke: var(--dg-line, #54595d); stroke-width: 1; }
    .dg .ln  { stroke: var(--dg-line, #54595d); stroke-width: 1.2; fill: none; }
    .dg .acc { stroke: var(--dg-accent, #3366cc); fill: none; stroke-width: 1.6; }
    .dg .accf { fill: var(--dg-accent, #3366cc); }
    .dg .lbl { font-size: 11px; }
    .dg .lbl-b { font-size: 11px; font-weight: 700; }
    .dg .lbl-sm { font-size: 9.5px; opacity: .78; }
    .dg .mono { font-family: ui-monospace, Consolas, "DejaVu Sans Mono", monospace; font-size: 10px; }

    /* 이 그림에서만 쓰는 것 */
    .dg .data  { stroke: var(--dg-line, #54595d); stroke-width: 1.6; fill: none; }
    .dg .ctrl  { stroke: var(--dg-accent, #3366cc); stroke-width: 1.3; fill: none;
                 stroke-dasharray: 5 3; }
    .dg .encl  { fill: none; stroke: var(--dg-line, #54595d); }
    .dg .fmt   { font-size: 9.5px; fill: var(--dg-text, #202122); }
    .dg .ctrl-t { font-size: 9.5px; fill: var(--dg-accent, #3366cc); }
    .dg .mask  { fill: var(--dg-fill2, #ffffff); stroke: none; }
  </style>

  <defs>
    <marker id="p_d" markerWidth="9" markerHeight="9" refX="7.2" refY="3.2" orient="auto">
      <path d="M0,0 L7.6,3.2 L0,6.4 z" fill="var(--dg-line, #54595d)"/>
    </marker>
    <marker id="p_c" markerWidth="8" markerHeight="8" refX="6.6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="var(--dg-accent, #3366cc)"/>
    </marker>
    <marker id="p_c2" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto">
      <path d="M7,0 L0,3 L7,6 z" fill="var(--dg-accent, #3366cc)"/>
    </marker>
  </defs>

  <!-- ══ 바깥 경계: 카메라 ══ -->
  <rect class="encl" x="56" y="44" width="684" height="276" rx="5"
        stroke-dasharray="5 4" stroke-width="1.1" opacity=".75"/>
  <text class="lbl-sm" x="68" y="314">카메라 — 임베디드 리눅스 보드</text>

  <!-- ══ SoC 경계 ══ -->
  <rect class="encl" x="236" y="72" width="470" height="186" rx="4" stroke-width="1.4"/>
  <text class="lbl-b" x="694" y="88" text-anchor="end">SoC</text>

  <!-- ══ 빛 ══ -->
  <g class="data">
    <path d="M12 128 H 70" marker-end="url(#p_d)"/>
    <path d="M12 142 H 70" marker-end="url(#p_d)"/>
    <path d="M12 156 H 70" marker-end="url(#p_d)"/>
  </g>
  <text class="lbl-b" x="12" y="116">빛</text>

  <!-- ══ 블록: 이미지 센서 ══ -->
  <rect class="bx2" x="76" y="104" width="120" height="76" rx="3"/>
  <text class="lbl-b"  x="136" y="128" text-anchor="middle">이미지 센서</text>
  <text class="lbl-sm" x="136" y="146" text-anchor="middle">CMOS · 베이어 CFA</text>
  <text class="lbl-sm" x="136" y="162" text-anchor="middle">롤링 셔터</text>

  <!-- ══ 블록: ISP ══ -->
  <rect class="bx" x="256" y="104" width="140" height="64" rx="3"/>
  <text class="lbl-b"  x="326" y="126" text-anchor="middle">ISP</text>
  <text class="lbl-sm" x="326" y="143" text-anchor="middle">디모자이킹 · 색보정</text>
  <text class="lbl-sm" x="326" y="158" text-anchor="middle">노이즈 제거</text>

  <!-- ══ 블록: 인코더 ══ -->
  <rect class="bx" x="446" y="104" width="140" height="64" rx="3"/>
  <text class="lbl-b"  x="516" y="126" text-anchor="middle">인코더 (VPU)</text>
  <text class="lbl-sm" x="516" y="143" text-anchor="middle">H.264 · H.265</text>
  <text class="lbl-sm" x="516" y="158" text-anchor="middle">MJPEG</text>

  <!-- ══ 블록: CPU ══ -->
  <rect class="bx" x="256" y="194" width="430" height="52" rx="3"/>
  <text class="lbl-b"  x="272" y="215">CPU — 리눅스</text>
  <text class="lbl-sm" x="272" y="232">RTSP · HTTP · TLS · 인증 · 감사기록 · 커널 · 드라이버</text>

  <!-- ══ 블록: 플래시 (SoC 밖, 카메라 안) ══ -->
  <rect class="bx2" x="256" y="272" width="200" height="36" rx="3"/>
  <text class="lbl-b"  x="268" y="288">플래시 (UBIFS)</text>
  <text class="lbl-sm" x="268" y="302">설정 · 인증서 · 감사기록</text>

  <!-- ══ 블록: 클라이언트 (카메라 밖) ══ -->
  <rect class="bx2" x="800" y="168" width="96" height="76" rx="3"/>
  <text class="lbl-b"  x="848" y="192" text-anchor="middle">클라이언트</text>
  <text class="lbl-sm" x="848" y="210" text-anchor="middle">디코딩 · 표시</text>
  <text class="lbl-sm" x="848" y="226" text-anchor="middle">지터 버퍼</text>

  <!-- ══ 데이터 경로 ══ -->
  <!-- 센서 → ISP -->
  <path class="data" d="M196 136 H 250" marker-end="url(#p_d)"/>
  <rect class="mask" x="190" y="86" width="66" height="13"/>
  <text class="fmt" x="223" y="96" text-anchor="middle">MIPI CSI-2</text>
  <rect class="mask" x="186" y="146" width="74" height="13"/>
  <text class="fmt" x="223" y="156" text-anchor="middle">베이어 RAW</text>

  <!-- ISP → 인코더 -->
  <path class="data" d="M396 136 H 440" marker-end="url(#p_d)"/>
  <text class="fmt" x="418" y="96"  text-anchor="middle">NV12</text>
  <text class="fmt" x="418" y="156" text-anchor="middle">YUV 4:2:0</text>

  <!-- 인코더 → CPU -->
  <path class="data" d="M496 168 V 188" marker-end="url(#p_d)"/>
  <text class="fmt" x="490" y="184" text-anchor="end">H.264 NAL</text>

  <!-- CPU → 클라이언트 -->
  <path class="data" d="M686 219 H 794" marker-end="url(#p_d)"/>
  <rect class="mask" x="682" y="198" width="116" height="13"/>
  <text class="fmt" x="740" y="208" text-anchor="middle">RTP · HTTP (TLS)</text>
  <text class="lbl-sm" x="740" y="234" text-anchor="middle">네트워크</text>

  <!-- ══ 제어 경로 ══ -->
  <!-- CPU → 센서 (I2C) -->
  <path class="ctrl" d="M256 230 H 136 V 186" marker-end="url(#p_c)"/>
  <text class="ctrl-t" x="150" y="247">I2C — 노출 · 게인</text>

  <!-- CPU → 인코더 -->
  <path class="ctrl" d="M566 194 V 174" marker-end="url(#p_c)"/>
  <text class="ctrl-t" x="576" y="184">비트레이트 · GOP</text>

  <!-- CPU ↔ 플래시 -->
  <path class="ctrl" d="M356 252 V 266" marker-end="url(#p_c)" marker-start="url(#p_c2)"/>
  <text class="ctrl-t" x="368" y="264">읽기 · 쓰기</text>

  <!-- ══ 범례 ══ -->
  <g>
    <path class="data" d="M60 340 H 96" marker-end="url(#p_d)"/>
    <text class="lbl-sm" x="104" y="344">데이터 — 지나갈 때마다 형식이 바뀐다</text>
    <path class="ctrl" d="M340 340 H 376" marker-end="url(#p_c)"/>
    <text class="lbl-sm" x="384" y="344">제어 · 설정 — CPU 가 센서와 인코더를 조종한다</text>
  </g>
</svg>
